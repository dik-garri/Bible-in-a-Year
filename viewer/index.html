<body>
  <div class="top-buttons">
    <button class="search-toggle-btn" onclick="toggleSearchBar()">🔍</button>
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
  </div>
  <div class="search-bar" id="search-bar">
    <button class="search-translation-btn" id="search-trans-btn" onclick="toggleSearchTranslation()">СИН</button>
    <input type="text" id="search-input" placeholder="Поиск...">
    <span class="search-info" id="search-info"></span>
    <button class="search-close" onclick="clearSearch()" title="Закрыть">✕</button>
  </div>
  <div class="settings-panel" id="settings-panel">
    <label>Размер шрифта</label>
    <div class="settings-row">
      <button onclick="changeFontSize(-1)">A−</button>
      <span class="size-label" id="font-size-label">17</span>
      <button onclick="changeFontSize(1)">A+</button>
    </div>
    <label>Шрифт</label>
    <div class="settings-row">
      <button onclick="setFont('serif')" id="font-serif" style="font-family: Georgia, serif">Аа</button>
      <button onclick="setFont('sans')" id="font-sans" style="font-family: Arial, sans-serif">Аа</button>
      <button onclick="setFont('mono')" id="font-mono" style="font-family: 'Courier New', monospace">Аа</button>
    </div>
    <label>Перевод</label>
    <div class="settings-row">
      <button id="btn-synod" class="active" onclick="setTranslation('synod')">СИН</button>
      <button id="btn-nrt" onclick="setTranslation('nrt')">НРП</button>
      <button id="btn-jbl" onclick="setTranslation('jbl')">ЮБЛ</button>
    </div>
    <label>Сравнение</label>
    <div class="settings-row">
      <label class="compare-checkbox"><input type="checkbox" id="cmp-synod" checked onchange="saveCompareSettings()"> СИН</label>
      <label class="compare-checkbox"><input type="checkbox" id="cmp-nrt" checked onchange="saveCompareSettings()"> НРП</label>
      <label class="compare-checkbox"><input type="checkbox" id="cmp-jbl" checked onchange="saveCompareSettings()"> ЮБЛ</label>
    </div>
    <label>Тема</label>
    <div class="settings-row">
      <button id="theme-light" onclick="setTheme('light')">☀️ День</button>
      <button id="theme-sepia" onclick="setTheme('sepia')">📜 Сепия</button>
      <button id="theme-dark" onclick="setTheme('dark')">🌙 Ночь</button>
    </div>
  </div>
  <h1>📖 Библия</h1>

  <div class="picker-section">
    <div class="picker-content" id="picker-content">
      <div class="testament-buttons">
        <button onclick="showTestament('ot')">Ветхий Завет</button>
        <button onclick="showTestament('nt')">Новый Завет</button>
      </div>
    </div>

    <div class="input-row" style="position: relative;">
      <input type="text" id="query" placeholder="Бытие 1-3; Матфея 1">
      <button class="help-btn" onclick="toggleHelp(event)" title="Примеры форматов">?</button>
      <div class="help-popup" id="help-popup">
        <div><code>Бытие 1-3</code> — главы 1-3</div>
        <div><code>Бытие 1:5</code> — глава 1, стих 5</div>
        <div><code>Бытие 1:5-10</code> — стихи 5-10</div>
        <div><code>Бытие 1:28-2:3</code> — межглавный</div>
        <div><code>Бытие 1; Матфея 1</code> — несколько книг</div>
      </div>
    </div>

    <button class="show-btn" onclick="showTexts()" style="margin-top: 8px;">Показать тексты</button>
  </div>

  <div id="content" class="content">
    <p style="color: #888; text-align: center;">Выберите книгу и главу или введите запрос вручную</p>
  </div>
  <div class="selection-bar" id="selection-bar">
    <span id="selection-count"></span>
    <button onclick="copySelected()">Копировать</button>
    <button class="clear-btn" onclick="clearSelection()">✕</button>
  </div>

  <script>
    const TRANSLATIONS = {
      synod: { name: 'Синодальный', short: 'СИН', dir: 'synodal', full: 'data/synodal.json' },
      nrt:   { name: 'НРП',         short: 'НРП', dir: 'nrt',     full: 'data/nrt.json' },
      jbl:   { name: 'Юбилейный',   short: 'ЮБЛ', dir: 'jbl',     full: 'data/jbl.json' }
    };
    const TRANSLATION_ORDER = ['synod', 'nrt', 'jbl'];
    const bookCache = {};
    let currentTranslation = 'synod';

    // Сравнение переводов
    function saveCompareSettings() {
      const enabled = TRANSLATION_ORDER.filter(t => document.getElementById('cmp-' + t).checked);
      localStorage.setItem('bible-compare', JSON.stringify(enabled));
    }
    function getCompareTranslations() {
      return TRANSLATION_ORDER.filter(t => t !== currentTranslation && document.getElementById('cmp-' + t).checked);
    }
    (function loadCompareSettings() {
      const saved = localStorage.getItem('bible-compare');
      if (saved) {
        const enabled = JSON.parse(saved);
        TRANSLATION_ORDER.forEach(t => {
          document.getElementById('cmp-' + t).checked = enabled.includes(t);
        });
      }
    })();

    // Параллельные места (cross-references)
    const xrefCache = {};
    async function loadXref(abbrev) {
      if (xrefCache[abbrev]) return xrefCache[abbrev];
      try {
        const resp = await fetch(`data/xref/${abbrev}.json`);
        if (!resp.ok) return {};
        const data = await resp.json();
        xrefCache[abbrev] = data;
        return data;
      } catch (e) { return {}; }
    }

    function parseXrefRef(ref) {
      const m = ref.match(/^([a-z0-9]+)\s+(\d+):(\d+)(?:-(\d+))?$/);
      if (!m) return null;
      return { abbrev: m[1], ch: parseInt(m[2]), vStart: parseInt(m[3]), vEnd: m[4] ? parseInt(m[4]) : parseInt(m[3]) };
    }

    function formatXrefRef(ref) {
      const short = BOOK_SHORT[ref.abbrev] || ref.abbrev;
      if (ref.vStart === ref.vEnd) return `${short} ${ref.ch}:${ref.vStart}`;
      return `${short} ${ref.ch}:${ref.vStart}-${ref.vEnd}`;
    }

    async function showXrefPanel(verseEl) {
      const icon = verseEl.querySelector('.xref-icon');
      // Убрать существующую панель
      const existing = verseEl.parentElement.querySelector('.xref-panel[data-for="' + verseEl.dataset.abbrev + ':' + verseEl.dataset.chapter + ':' + verseEl.dataset.verse + '"]');
      if (existing) { existing.remove(); if (icon) icon.textContent = '⇄'; return; }

      const abbrev = verseEl.dataset.abbrev;
      const ch = verseEl.dataset.chapter;
      const v = verseEl.dataset.verse;
      const xrefs = await loadXref(abbrev);
      const refs = xrefs[`${ch}:${v}`];
      if (!refs || refs.length === 0) return;

      const SHOW_INITIAL = 5;
      const panel = document.createElement('div');
      panel.className = 'xref-panel';
      panel.dataset.for = `${abbrev}:${ch}:${v}`;
      panel.innerHTML = '<div style="font-size:11px;color:#c07b20;margin-bottom:4px">Загрузка...</div>';

      // Вставить после стиха (и его compare-панелей)
      let insertAfter = verseEl;
      let sib = verseEl.nextElementSibling;
      while (sib && sib.classList.contains('verse-compare')) { insertAfter = sib; sib = sib.nextElementSibling; }
      insertAfter.insertAdjacentElement('afterend', panel);

      // Загрузить тексты
      const dir = TRANSLATIONS[currentTranslation].dir;
      const items = [];
      for (const [refStr, votes] of refs) {
        const parsed = parseXrefRef(refStr);
        if (!parsed) continue;
        try {
          const cacheKey = `${currentTranslation}:${parsed.abbrev}`;
          let chapters = bookCache[cacheKey];
          if (!chapters) {
            const resp = await fetch(`data/${dir}/${parsed.abbrev}.json`);
            chapters = await resp.json();
            bookCache[cacheKey] = chapters;
          }
          const texts = [];
          for (let vi = parsed.vStart; vi <= parsed.vEnd; vi++) {
            const t = chapters[parsed.ch - 1]?.[vi - 1];
            if (t) texts.push(t);
          }
          if (texts.length > 0) {
            items.push({ ref: parsed, refStr, label: formatXrefRef(parsed), text: texts.join(' '), votes });
          }
        } catch (e) { /* пропускаем */ }
      }

      if (items.length === 0) { panel.remove(); return; }

      function renderItems(count) {
        const visible = items.slice(0, count);
        let html = visible.map(it =>
          `<div class="xref-item"><span class="xref-ref" data-query="${it.refStr}">${it.label}</span><div class="xref-text">${it.text}</div></div>`
        ).join('');
        if (count < items.length) {
          html += `<div class="xref-more" onclick="this.parentElement._showAll()">Ещё ${items.length - count}...</div>`;
        }
        html += `<div class="xref-more" onclick="this.parentElement._close()">✕ Закрыть</div>`;
        panel.innerHTML = html;
      }

      panel._showAll = () => renderItems(items.length);
      panel._close = () => { panel.remove(); if (icon) icon.textContent = '⇄'; };
      renderItems(SHOW_INITIAL);
      if (icon) icon.textContent = '✕';
    }

    // Размер шрифта
    let contentFontSize = parseInt(localStorage.getItem('bible-font-size')) || 17;
    function applyFontSize() {
      document.getElementById('content').style.fontSize = contentFontSize + 'px';
      document.getElementById('font-size-label').textContent = contentFontSize;
    }
    function changeFontSize(delta) {
      contentFontSize = Math.max(12, Math.min(28, contentFontSize + delta));
      localStorage.setItem('bible-font-size', contentFontSize);
      applyFontSize();
    }
    applyFontSize();

    // Тема
    function applyTheme(theme) {
      document.body.classList.remove('dark', 'sepia');
      if (theme === 'dark') document.body.classList.add('dark');
      if (theme === 'sepia') document.body.classList.add('sepia');
      ['light', 'sepia', 'dark'].forEach(t => {
        document.getElementById('theme-' + t).classList.toggle('active', t === theme);
      });
    }
    function setTheme(theme) {
      localStorage.setItem('bible-theme', theme);
      applyTheme(theme);
    }
    (function() {
      let theme = localStorage.getItem('bible-theme');
      if (!theme) {
        // Миграция со старого формата
        if (localStorage.getItem('bible-dark-theme') === 'true') theme = 'dark';
        else theme = 'light';
        localStorage.setItem('bible-theme', theme);
        localStorage.removeItem('bible-dark-theme');
      }
      applyTheme(theme);
    })();

    // Панель настроек
    function toggleSettings() {
      document.getElementById('settings-panel').classList.toggle('show');
      document.getElementById('help-popup').classList.remove('show');
      clearSearch();
    }
    function toggleHelp(e) {
      e.stopPropagation();
      document.getElementById('help-popup').classList.toggle('show');
      document.getElementById('settings-panel').classList.remove('show');
    }
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('settings-panel');
      const btn = document.querySelector('.settings-btn');
      if (!panel.contains(e.target) && !btn.contains(e.target)) {
        panel.classList.remove('show');
      }
      const helpPopup = document.getElementById('help-popup');
      const helpBtn = e.target.closest('.help-btn');
      if (!helpPopup.contains(e.target) && !helpBtn) {
        helpPopup.classList.remove('show');
      }
      const searchBar = document.getElementById('search-bar');
      const searchToggle = document.querySelector('.search-toggle-btn');
      if (!searchBar.contains(e.target) && !searchToggle.contains(e.target)) {
        if (searchBar.classList.contains('show') && !document.getElementById('search-input').value) {
          searchBar.classList.remove('show');
        }
      }
    });

    // Поиск по всей Библии
    let fullBibleCache = {}; // { 'synod': [...], 'nrt': [...] }
    let searchDebounce;

    function toggleSearchBar() {
      const bar = document.getElementById('search-bar');
      const input = document.getElementById('search-input');
      document.getElementById('settings-panel').classList.remove('show');
      if (bar.classList.toggle('show')) {
        input.focus();
      } else {
        clearSearch();
      }
    }

    async function loadFullBible() {
      if (fullBibleCache[currentTranslation]) return fullBibleCache[currentTranslation];
      const file = TRANSLATIONS[currentTranslation].full;
      const resp = await fetch(file);
      const data = await resp.json();
      fullBibleCache[currentTranslation] = data;
      return data;
    }

    // Убирает знаки препинания для сравнения
    function stripPunct(s) {
      return s.replace(/[^\p{L}\p{N}\s]/gu, '').toLowerCase();
    }

    async function performSearch() {
      const term = document.getElementById('search-input').value.trim();
      const info = document.getElementById('search-info');
      const content = document.getElementById('content');

      if (!term || term.length < 2) {
        info.textContent = '';
        return;
      }

      info.textContent = '...';
      let bible;
      try {
        bible = await loadFullBible();
      } catch (e) {
        info.textContent = '';
        content.innerHTML = '<div class="error">Не удалось загрузить данные</div>';
        return;
      }

      // Разбиваем запрос на слова
      const words = stripPunct(term).split(/\s+/).filter(w => w.length > 0);
      if (!words.length) { info.textContent = ''; return; }

      // 1) Фраза целиком (слова подряд, игнорируя пунктуацию и регистр)
      const phraseEsc = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+');
      const phraseRe = new RegExp(phraseEsc, 'iu');

      // 2) Каждое слово как отдельное слово (границы)
      const wordExactRes = words.map(w => {
        const esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp(`(?<=^|\\s|[^\\p{L}\\p{N}])${esc}(?=$|\\s|[^\\p{L}\\p{N}])`, 'giu');
      });

      // 3) Каждое слово как часть слова
      const wordPartialRes = words.map(w => {
        return new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'giu');
      });

      const phrase = [];   // точная фраза подряд
      const allWords = []; // все слова как отдельные, но не подряд
      const partial = [];  // все слова как части слов
      const MAX = 100;

      for (const book of bible) {
        const name = BOOK_NAMES[book.abbrev] || book.abbrev;
        for (let ch = 0; ch < book.chapters.length; ch++) {
          for (let v = 0; v < book.chapters[ch].length; v++) {
            const text = book.chapters[ch][v];
            const clean = stripPunct(text);
            const total = phrase.length + allWords.length + partial.length;
            if (total >= MAX) break;

            // Проверка фразы
            if (phraseRe.test(clean)) {
              phrase.push({ name, abbrev: book.abbrev, ch: ch + 1, v: v + 1, text });
              continue;
            }

            // Проверка всех слов как отдельных
            let allExact = true;
            for (const re of wordExactRes) {
              re.lastIndex = 0;
              if (!re.test(clean)) { allExact = false; break; }
            }
            if (allExact) {
              allWords.push({ name, abbrev: book.abbrev, ch: ch + 1, v: v + 1, text });
              continue;
            }

            // Проверка всех слов как частей
            let allPartial = true;
            for (const re of wordPartialRes) {
              re.lastIndex = 0;
              if (!re.test(clean)) { allPartial = false; break; }
            }
            if (allPartial) {
              partial.push({ name, abbrev: book.abbrev, ch: ch + 1, v: v + 1, text });
            }
          }
          if (phrase.length + allWords.length + partial.length >= MAX) break;
        }
        if (phrase.length + allWords.length + partial.length >= MAX) break;
      }

      const total = phrase.length + allWords.length + partial.length;
      info.textContent = total >= MAX ? `${MAX}+` : total;

      if (total === 0) {
        content.innerHTML = '<p style="color:#888;text-align:center;">Ничего не найдено</p>';
        return;
      }

      // Подсветка каждого слова
      const highlightParts = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const highlightRe = new RegExp(`(${highlightParts.join('|')})`, 'gi');

      let html = `<div class="search-results-header">Найдено: ${total >= MAX ? 'более ' + MAX : total}</div>`;

      function renderResults(list) {
        let h = '';
        for (const r of list) {
          const highlighted = r.text.replace(highlightRe, '<mark>$1</mark>');
          h += `<div class="search-result" onclick="goToSearchResult('${r.name}', ${r.ch}, ${r.v})">`;
          h += `<div class="search-result-ref">${r.name} ${r.ch}:${r.v}</div>`;
          h += `<div class="search-result-text"><span class="verse-num">${r.v}</span> ${highlighted}</div>`;
          h += `</div>`;
        }
        return h;
      }

      const hasMultiple = [phrase, allWords, partial].filter(a => a.length > 0).length > 1;
      if (phrase.length > 0) {
        if (hasMultiple) html += `<div class="search-results-header" style="margin-top:12px;">Точная фраза: ${phrase.length}</div>`;
        html += renderResults(phrase);
      }
      if (allWords.length > 0) {
        if (hasMultiple) html += `<div class="search-results-header" style="margin-top:12px;">Все слова: ${allWords.length}</div>`;
        html += renderResults(allWords);
      }
      if (partial.length > 0) {
        if (hasMultiple) html += `<div class="search-results-header" style="margin-top:12px;">Частичные: ${partial.length}</div>`;
        html += renderResults(partial);
      }
      content.innerHTML = html;
      window.scrollTo(0, 0);
    }

    async function goToSearchResult(bookName, chapter, verse) {
      clearSearch();
      document.getElementById('query').value = `${bookName} ${chapter}`;
      await showTexts();
      if (verse) {

    async function loadBook(abbrev) {
      const cacheKey = `${currentTranslation}:${abbrev}`;
      if (bookCache[cacheKey]) return bookCache[cacheKey];

      const dir = TRANSLATIONS[currentTranslation].dir;
      const file = `data/${dir}/${abbrev}.json`;

      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('Файл не найден');
        const chapters = await response.json();
        bookCache[cacheKey] = chapters;
        return chapters;
      } catch (e) {
        throw new Error(`Не удалось загрузить ${file}: ${e.message}`);
      }
    }

    function parseQuery(query) {
      // Форматы:
      // "Бытие 1" → глава 1, все стихи
      // "Бытие 1-3" → главы 1-3, все стихи
      // "Бытие 1:5" → глава 1, стих 5
      // "Бытие 1:5-10" → глава 1, стихи 5-10
      // "Бытие 1:5-2:3" → от главы 1 стих 5 до главы 2 стих 3
      // "Бытие 1-2:3" → от главы 1 стих 1 до главы 2 стих 3
      const parts = query.split(';').map(s => s.trim()).filter(s => s);
      const result = [];

      for (const part of parts) {
        const match = part.match(/^(.+?)\s+(\d+)(?::(\d+))?(?:-(\d+)(?::(\d+))?)?$/);

        if (match) {
          const bookName = match[1].trim().toLowerCase();
          const abbrev = BOOK_MAP[bookName];

          if (!abbrev) {
            console.warn('Книга не найдена:', bookName);
            continue;
          }

          const num1 = parseInt(match[2]);
          const num2 = match[3] ? parseInt(match[3]) : null;
          const num3 = match[4] ? parseInt(match[4]) : null;
          const num4 = match[5] ? parseInt(match[5]) : null;

          let chapterStart, chapterEnd, verseStart, verseEnd;

          if (num2 === null && num4 === null) {
            chapterStart = num1;
            chapterEnd = num3 !== null ? num3 : num1;
            verseStart = null;
            verseEnd = null;
          } else if (num2 === null && num4 !== null) {
            chapterStart = num1;
            verseStart = 1;
            chapterEnd = num3;
            verseEnd = num4;
          } else {
            chapterStart = num1;
            verseStart = num2;

            if (num4 !== null) {
              chapterEnd = num3;
              verseEnd = num4;
            } else if (num3 !== null) {
              chapterEnd = num1;
              verseEnd = num3;
            } else {
              chapterEnd = num1;
              verseEnd = num2;
            }
          }

          result.push({
            abbrev,
            chapterStart,
            chapterEnd,
            verseStart,
            verseEnd
          });
        }
      }

      return result;
    }

    function renderTexts(parsed, loadedBooks, loadedXrefs) {
      let html = '';

      for (const item of parsed) {
        const chapters = loadedBooks[item.abbrev];
        if (!chapters) {
          html += `<div class="error">Книга не найдена: ${item.abbrev}</div>`;
          continue;
        }

        const bookName = BOOK_NAMES[item.abbrev] || item.abbrev;
        html += `<div class="book-section"><div class="book-title">${bookName}</div>`;

        for (let ch = item.chapterStart; ch <= item.chapterEnd; ch++) {
          const chapterIdx = ch - 1;
          if (chapterIdx < 0 || chapterIdx >= chapters.length) {
            html += `<div class="error">Глава ${ch} не найдена</div>`;
            continue;
          }

          const verses = chapters[chapterIdx];
          const shortName = BOOK_SHORT[item.abbrev] || bookName;
          html += `<div class="chapter"><div class="chapter-title" data-book="${bookName}" data-chapter="${ch}" data-base="${shortName} ${ch}">${bookName} — Глава ${ch}<div class="chapter-progress"></div></div>`;

          let vStart = 1;
          let vEnd = verses.length;

          if (item.verseStart !== null) {
            if (ch === item.chapterStart && ch === item.chapterEnd) {
              vStart = item.verseStart;
              vEnd = item.verseEnd;
            } else if (ch === item.chapterStart) {
              vStart = item.verseStart;
            } else if (ch === item.chapterEnd) {
              vEnd = item.verseEnd;
            }
          }

          const xrefs = loadedXrefs[item.abbrev] || {};
          for (let v = vStart; v <= vEnd && v <= verses.length; v++) {
            const text = verses[v - 1];
            const hasXref = xrefs[`${ch}:${v}`];
            const xrefIcon = hasXref ? '<span class="xref-icon" title="Параллельные места">⇄</span>' : '';
            html += `<div class="verse" data-book="${bookName}" data-abbrev="${item.abbrev}" data-chapter="${ch}" data-verse="${v}"><span class="verse-num">${v}</span>${text}${xrefIcon}</div>`;
          }

          html += '</div>';
        }

        html += '</div>';
      }

      // Навигация пред/след глава
      const nav = getChapterNav(parsed);
      if (nav) {
        html += '<div class="chapter-nav">';
        if (nav.prev) html += `<button onclick="navigateTo('${nav.prev.query}')">${nav.prev.label}</button>`;
        if (nav.next) html += `<button onclick="navigateTo('${nav.next.query}')">${nav.next.label}</button>`;
        html += '</div>';
      }

      return html;
    }

    async function showTexts() {
      const query = document.getElementById('query').value.trim();
      const content = document.getElementById('content');

      if (!query) {
        document.title = 'Библия — Просмотр текстов';
        content.innerHTML = '<p style="color: #888; text-align: center;">Выберите книгу и главу или введите запрос вручную</p>';
        return;
      }

      content.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const parsed = parseQuery(query);

        if (parsed.length === 0) {
          content.innerHTML = '<div class="error">Не удалось распознать запрос. Проверьте формат.</div>';
          return;
        }

        // Загрузить только нужные книги + параллельные места
        const abbrevs = [...new Set(parsed.map(p => p.abbrev))];
        const loadedBooks = {};
        const loadedXrefs = {};
        await Promise.all([
          ...abbrevs.map(async (abbrev) => { loadedBooks[abbrev] = await loadBook(abbrev); }),
          ...abbrevs.map(async (abbrev) => { loadedXrefs[abbrev] = await loadXref(abbrev); })
        ]);

        document.title = query + ' — Библия';
        content.innerHTML = renderTexts(parsed, loadedBooks, loadedXrefs);
        localStorage.setItem('bible-last-query', query);
        localStorage.setItem('bible-last-translation', currentTranslation);
      } catch (e) {
        content.innerHTML = `<div class="error">${e.message}</div>`;
      }
    }

    let debounceTimer;
    document.getElementById('query').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(showTexts, 400);
    });

      document.querySelectorAll('.verse-compare').forEach(v => v.remove());
      updateSelectionBar();
    }

    function buildBookRef(verses) {
      // Группируем последовательные стихи в диапазоны
      const groups = [];
      let curCh = null, curRun = null;
      for (const v of verses) {
        const ch = v.dataset.chapter;
        const num = parseInt(v.dataset.verse);
        if (ch === curCh && curRun && num === curRun.end + 1) {
          curRun.end = num;
        } else {
          curRun = { ch, start: num, end: num };
          groups.push(curRun);
        }
        curCh = ch;
      }
      const sameChapter = groups.every(g => g.ch === groups[0].ch);
      if (sameChapter) {
        const ch = groups[0].ch;
        const parts = groups.map(g =>
          g.start === g.end ? `${g.start}` : `${g.start}-${g.end}`
        );
        return `${ch}:${parts.join(',')}`;
      }
      return groups.map(g =>
        g.start === g.end ? `${g.ch}:${g.start}` : `${g.ch}:${g.start}-${g.end}`
      ).join(',');
    }

    function copySelected() {
      const selected = Array.from(document.querySelectorAll('.verse.selected'));
      if (!selected.length) return;

      // Группируем по книгам (сохраняя порядок)
      const bookGroups = [];
      let curBook = null, curGroup = null;
      for (const v of selected) {
        const book = v.dataset.book;
        if (book !== curBook) {
          curGroup = { book, verses: [] };
          bookGroups.push(curGroup);
          curBook = book;
        }
        curGroup.verses.push(v);
      }

      const translationName = TRANSLATIONS[currentTranslation].short;
      const blocks = bookGroups.map(g => {
        const ref = `${g.book} ${buildBookRef(g.verses)} (${translationName})`;
        const lines = g.verses.map(v => {
          const clone = v.cloneNode(true);
          clone.querySelectorAll('.xref-icon').forEach(el => el.remove());
          const text = clone.textContent.replace(/^\d+\s*/, '');
          return `${v.dataset.verse} ${text}`;
        });
        return `${ref}\n${lines.join('\n')}`;
      });
      const copyText = blocks.join('\n\n');
      navigator.clipboard.writeText(copyText).then(() => {
        clearSelection();
      });
    }

    document.getElementById('content').addEventListener('click', async (e) => {
      // Клик по ссылке параллельного места — навигация
      if (e.target.classList.contains('xref-ref')) {
        const q = e.target.dataset.query;
        if (q) {
          const parsed = parseXrefRef(q);
          const chapterQuery = parsed ? `${parsed.abbrev} ${parsed.ch}` : q;
          document.getElementById('query').value = queryToCyrillic(chapterQuery);
          await showTexts();
          if (parsed) {
            const el = document.querySelector(`.verse[data-abbrev="${parsed.abbrev}"][data-chapter="${parsed.ch}"][data-verse="${parsed.vStart}"]`);
            if (el) {
              el.scrollIntoView({ block: 'center', behavior: 'smooth' });
              el.classList.add('selected');
              setTimeout(() => el.classList.remove('selected'), 1500);
            }
          }
        }
        return;
      }
      // Клик по иконке 🔗 — показать/скрыть панель
      if (e.target.classList.contains('xref-icon')) {
        e.stopPropagation();
        const verse = e.target.closest('.verse');
        if (verse) showXrefPanel(verse);
        return;
      }
      const verse = e.target.closest('.verse');
      if (!verse) return;
      const wasSelected = verse.classList.toggle('selected');
      // Убрать панели сравнения если снято выделение
      let sib = verse.nextElementSibling;
      while (sib && sib.classList.contains('verse-compare')) {
        const next = sib.nextElementSibling;
        sib.remove();
        sib = next;
      }
      // Добавить сравнение если выделен
      if (wasSelected) {
        const abbrev = verse.dataset.abbrev;
        const ch = parseInt(verse.dataset.chapter);
        const v = parseInt(verse.dataset.verse);
        const others = getCompareTranslations();
        let insertAfter = verse;
        for (const otherTranslation of others) {
          try {
            const cacheKey = `${otherTranslation}:${abbrev}`;
            let chapters = bookCache[cacheKey];
            if (!chapters) {
              const dir = TRANSLATIONS[otherTranslation].dir;
              const resp = await fetch(`data/${dir}/${abbrev}.json`);
              chapters = await resp.json();
              bookCache[cacheKey] = chapters;
            }
            const text = chapters[ch - 1]?.[v - 1];
            if (text) {
              const panel = document.createElement('div');
              panel.className = 'verse-compare';
              panel.innerHTML = `<div class="verse-compare-label">${TRANSLATIONS[otherTranslation].short}</div>${text}`;
              insertAfter.insertAdjacentElement('afterend', panel);
              insertAfter = panel;
            }
          } catch (e) { /* тихо игнорируем */ }
        }
      }
      updateSelectionBar();
    });

    // Обновляет номер стиха в sticky заголовке главы при скролле
    window.addEventListener('scroll', () => {
      const titles = document.querySelectorAll('.chapter-title');
      titles.forEach(title => {
        const rect = title.getBoundingClientRect();
        const progressBar = title.querySelector('.chapter-progress');
        const base = title.dataset.base;
        if (rect.top <= 0) {
          const chapter = title.parentElement;
          const verses = chapter.querySelectorAll('.verse');
          let currentVerse = null;
          let visibleCount = 0;
          for (const v of verses) {
            if (v.getBoundingClientRect().top <= 40) {
              currentVerse = v.dataset.verse;
              visibleCount++;
            } else {
              break;
            }
          }
          title.firstChild.textContent = currentVerse ? `${base}:${currentVerse}` : base;
          const progress = verses.length > 0 ? (visibleCount / verses.length) * 100 : 0;
          progressBar.style.width = progress + '%';
        } else {
          title.firstChild.textContent = base;
          progressBar.style.width = '0';
        }
      });
    });

    // Вычисляет prev/next главу для текущего запроса
    function getChapterNav(parsed) {
      if (!parsed || parsed.length !== 1 || parsed[0].verseStart !== null) return null;
      const item = parsed[0];
      const allBooks = [...OT_BOOKS, ...NT_BOOKS];
      const bookIdx = allBooks.findIndex(b => b[1] === item.abbrev);
      if (bookIdx < 0) return null;
      const book = allBooks[bookIdx];
      const nav = { prev: null, next: null };

      const short = BOOK_SHORT[item.abbrev] || book[0];
      if (item.chapterStart > 1) {
        nav.prev = { label: `← ${short} ${item.chapterStart - 1}`, query: `${book[0]} ${item.chapterStart - 1}` };
      } else if (bookIdx > 0) {
        const pb = allBooks[bookIdx - 1];
        const pbs = BOOK_SHORT[pb[1]] || pb[0];
        nav.prev = { label: `← ${pbs} ${pb[2]}`, query: `${pb[0]} ${pb[2]}` };
      }
      if (item.chapterEnd < book[2]) {
        nav.next = { label: `${short} ${item.chapterEnd + 1} →`, query: `${book[0]} ${item.chapterEnd + 1}` };
      } else if (bookIdx < allBooks.length - 1) {
        const nb = allBooks[bookIdx + 1];
        const nbs = BOOK_SHORT[nb[1]] || nb[0];
        nav.next = { label: `${nbs} 1 →`, query: `${nb[0]} 1` };
      }
      return (nav.prev || nav.next) ? nav : null;
    }

    // Клавиатурная навигация: ← → для пред/след главы
    document.addEventListener('keydown', (e) => {
      // Ctrl+F / Cmd+F — открыть поиск по Библии
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        const bar = document.getElementById('search-bar');
        if (!bar.classList.contains('show')) toggleSearchBar();
        else document.getElementById('search-input').focus();
        return;
      }
      // Enter в поле поиска — выполнить поиск
      if (e.key === 'Enter' && e.target.id === 'search-input') {
        e.preventDefault();
        clearTimeout(searchDebounce);
        performSearch();
        return;
      }
      // Escape — закрыть поиск
      if (e.key === 'Escape' && document.getElementById('search-bar').classList.contains('show')) {
        clearSearch();
        return;
      }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const query = document.getElementById('query').value.trim();
      if (!query) return;
      const parsed = parseQuery(query);
      const nav = getChapterNav(parsed);
      if (!nav) return;
      if (e.key === 'ArrowLeft' && nav.prev) navigateTo(nav.prev.query);
      if (e.key === 'ArrowRight' && nav.next) navigateTo(nav.next.query);
    });

    // Свайп навигация на мобильных
    (function() {
      let touchStartX = 0;
      let touchStartY = 0;
      document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });
      document.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) < 80 || Math.abs(dy) > Math.abs(dx) * 0.5) return;
        const query = document.getElementById('query').value.trim();
        if (!query) return;
        const parsed = parseQuery(query);
        const nav = getChapterNav(parsed);
        if (!nav) return;
        if (dx > 0 && nav.prev) navigateTo(nav.prev.query);
        if (dx < 0 && nav.next) navigateTo(nav.next.query);
      }, { passive: true });
    })();

    // Конвертирует латинские аббревиатуры в русские названия: "gn 1-3;mt 1" → "Бытие 1-3; Матфея 1"
    function queryToCyrillic(query) {
      return query.split(';').map(part => {
        part = part.trim();
        const match = part.match(/^([a-z0-9]+)\s+(.*)$/i);
        if (!match) return part;
        const abbrev = match[1].toLowerCase();
        const rest = match[2];
        const name = BOOK_NAMES[abbrev];
        return name ? `${name} ${rest}` : part;
      }).join('; ');
    }

    // Загрузка из URL-параметров или последнего чтения
    (function() {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q');
      const translation = params.get('t');

      if (TRANSLATIONS[translation]) {
        setTranslation(translation, true);
      }

      if (query) {
        document.getElementById('query').value = queryToCyrillic(query);
        showTexts();
      } else {
        const lastQuery = localStorage.getItem('bible-last-query');
        const lastTranslation = localStorage.getItem('bible-last-translation');
        if (lastQuery) {
          if (lastTranslation) setTranslation(lastTranslation, true);
          document.getElementById('query').value = lastQuery;
          showTexts();
        }
      }
    })();
  </script>
</body>
